say "Здесь есть 5 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias no-variants   "say инста не завезли; ";
alias jt            "say Jump Throw; ";
alias jt+w          "say Jump Throw + W; ";
alias ctrl+jt+w     "say на шифте до конца петельки Jump throw; ";


alias variants-m    "say возможные вариации текущего спавна: { .mid }; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos 2292.060059 2027.689941 199.308151; ";

alias mid1      ".pos1; setang -27.221884 -137.818161 0; jt; ";

alias .spawn1   ".pos1; variants-m; alias .mid mid1; ";

