alias no-variants   "say инста не завезли; ";
alias jt            "say Jump Throw; ";
alias jt+w          "say Jump Throw + W; ";
alias ctrl+jt+w     "say на шифте до конца петельки Jump throw; ";


alias variants-m    "say возможные вариации текущего спавна: { .mid }; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .spawn1   "variants-m; setpos 2292.060059 2027.689941 199.308151; alias .mid 1mid; ";
alias 1mid      "jt; setang -27.221884 -137.818161 0; ";

