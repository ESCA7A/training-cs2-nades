say "Здесь есть 10 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias no-variants   "say нет вариантов; ";
alias variants-msj  "say возможные вариации текущего спавна: { .mid | .stairs | .jungle }; ";
alias variants2-sj  "say возможные вариации текущего спавна: { .stairs | .jungle }; ";
alias variants3-m   "say возможные вариации текущего спавна: { .mid }; ";

alias jt            "say jumpt throw; ";
alias jt+W          "say jumpt throw + W; ";


//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos 1136.000122 31.999878 -100.970078; ";

alias mid1      ".pos1; setang -41.477901 -164.416046 0; say отойти назад до черной хуйни JT + W; ";

alias .spawn1   ".pos1; variants3-m; alias .mid mid1; ";

