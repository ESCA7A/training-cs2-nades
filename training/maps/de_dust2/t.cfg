say "Здесь есть 15 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias jt            "say Jump Throw; ";
alias jt+W          "say jump throw + W; ";
alias ctrl+jt       "say ctrl + jump throw; ";

alias variants-ml   "say возможные вариации текущего спавна: { .mid | .long }; ";
alias variants-m    "say возможные вариации текущего спавна: { .mid }; ";
alias variants-l    "say возможные вариации текущего спавна: { .long }; ";
alias no-variants   "say не найдено смоков с этого спавна; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos -332 -754 138.009216; ";

alias mid1      ".pos1; setang -13.812615 91.205360 0; jt; ";
alias long1     ".pos1; setang -19.819672 51.676605 0; jt; ";

alias .spawn1   ".pos1; variants-ml; alias .mid mid1; alias .long long1; ";

