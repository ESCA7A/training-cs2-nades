say "Здесь есть 5 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias jtByRun       "say_team Jump Throw на бегу; ";
alias jtByShift     "say_team Jump Throw с микрошифта; ";
alias variants-md   "say возможные вариации текущего спавна: { .mid | .bdoor }; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos -192 1696 88.633125; ";

alias mid1      ".pos1; setang -31.960171 -108.400871; jtByShift; ";
alias bdoor1    ".pos1; setang -16.147913 -51.084488; jtByRun; ";

alias .spawn1   ".pos1; variants-md; alias .mid mid1; alias .bdoor bdoor1; ";

