say "Здесь есть 5 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias jtByRun   "say Jump Throw на бегу; ";
alias jtByShift "say Jump Throw с микрошифта; ";
alias variants  "say возможные вариации текущего спавна: { .mid | .donut | .donutmid | .cave }; ";


//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1         "setpos -520 -2224 -99.255737; ";

alias mid1          ".pos1; setang -37.091675 88.357727 0; jtByShift; ";
alias donut1        ".pos1; setang -41.648853 52.276852 0; jtByRun; ";
alias cave1         ".pos1; setang -62.148216 65.361214 0; say пройти вперед пока моделька не выпрется по правому краю и прицел не попадет на краешек лепестка; ";
alias donutmid1     ".pos1; setang -33.783958 97.827347 0; say Отойти влево до центра цветка jump throw; ";

alias .spawn1       ".pos1; variants; alias .mid mid1; alias .donut donut1; alias .cave cave1; alias .donutmid donutmid1; ";

