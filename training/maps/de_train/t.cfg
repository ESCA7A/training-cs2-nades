//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos -1850 1256.000122 -108.128754; ";

alias .cross1   ".pos1; setang -51.876293 -24.679998 0; ";

alias .spawn1   ".pos1; variants-c; alias .cross .cross1; ";

