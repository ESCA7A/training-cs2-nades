say "Здесь есть 11 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias jt            "say Jump Throw; ";
alias jt+W          "say Jump Throw; ";
alias instaHeaven   "say бежать до стейрса, прижаться к левому углу A+W + jumpt throw; ";

alias variants-mc   "say возможные вариации текущего спавна: { .mid | .con }; ";
alias variants-mcf  "say возможные вариации текущего спавна: { .mid | .con | .fnatic }; ";
alias variants-mcfh "say возможные вариации текущего спавна: { .mid | .con | .fnatic | .heaven }; ";
alias variants-mch  "say возможные вариации текущего спавна: { .mid | .con | .heaven }; ";
alias variants-mfh  "say возможные вариации текущего спавна: { .mid | .fnatic | .heaven }; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1     "setpos -192.000443 -1608.000244 51.871262; ";

alias mid1      ".pos1; setang -6.446883 87.212334; jt; ";
alias con1      ".pos1; setang -37.069572 104.810272; say верхняя часть круга в упор к тени [JUMP + W]; ";
alias fnatic1   ".pos1; setang -12.196884 91.614319; say инста молотов кон; ";
alias heaven1   ".pos1; setang -14.233965 83.616943 0; instaHeaven; ";

alias .spawn1   ".pos1; variants-mcfh; alias .mid mid1; alias .con con1; alias .heaven heaven1; alias .fnatic fnatic1; ";

