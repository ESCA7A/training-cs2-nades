say "Здесь есть 6 спавнов. Что бы попробовать нужно ввести в консоль: .spawn{номер спавна}. Например .spawn1; ";

alias variants-msb  "say возможные вариации текущего спавна: { .mid | .stairs | .bmain }; ";
alias jtByHud       "say Jump Throw по худу; ";

//----------------------------------------------+
//              SPAWN 1                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos1    "setpos -672.001099 2152 79.896599; ";

alias mid1     ".pos1; setang -47.704128 -75.959953 0; say Jump Throw по углу крыши; ";
alias stairs1  ".pos1; setang -49.969379 -55.563805 0; say W + Jump Throw по худу. Худ между цветами; ";
alias bmain1   ".pos1; setang -56.663692 -116.093239 0; jtByHud; ";

alias .spawn1  ".pos1; variants-msb; alias .mid mid1; alias .stairs stairs1; alias .bmain bmain1; ";              

//----------------------+-----------------------------------------------------------------------------------------------------+
//                      |
//                      |
//----------------------+-----------------------+
//              SPAWN 2                         |
//----------------------------------------------------------------------------------------------------------------------------+

alias .pos2     "setpos -560.000549 2192.000488 82.280006; ";

alias mid2      ".pos2; setang -49.990208 -78.480675 0; say Hump Throw по худу между цветами; ";
alias stairs2   ".pos2; setang -36.069504 -59.031738 0; say Jump Throw по углу крыши; ";
alias bmain2    ".pos2; setang -51.505451 -118.178307 0; jtByHud; ";

alias .spawn2   ".pos2; variants-msb; alias .mid mid2; alias .stairs stairs2; alias .bmain bmain2; ";

//----------------------+-----------------------------------------------------------------------------------------------------+
//                      |
//                      |
//----------------------+-----------------------+
//              SPAWN 3                         |
//----------------------------------------------------------------------------------------------------------------------------+

alias .pos3     "setpos -476 2216 88.063087; ";

alias mid3      ".pos3; setang -29.180353 -80.561295 0; say Jump Throw по углу на камне; ";
alias stairs3   ".pos3; setang -21.011135 -60.992195 0; say Jump Throw ниже цветов на пересечении балки слева и верхнего камня; ";
alias bmain3    ".pos3; setang -51.510887 -119.094383 0; jtByHud; ";

alias .spawn3   ".pos3; variants-msb; alias .mid mid3; alias .stairs stairs3; alias .bmain bmain3; ";

//----------------------+-----------------------------------------------------------------------------------------------------+
//                      |
//                      |
//----------------------+-----------------------+
//              SPAWN 4                         |
//----------------------------------------------------------------------------------------------------------------------------+

alias .pos4     "setpos -400 2192 82.279724; ";

alias mid4      ".pos4; setang -51.295296 -82.859444 0; say выровнять худ по центру последних двух кирпичей Jumo Throw; ";
alias stairs4   ".pos4; setang -40.671902 -60.983124 0; say выровнять низ худа по пересечению двух кирпичей Jump Throw; ";
alias bmain4    ".pos4; setang -46.889111 -120.067551 0; say Jump Throw левее и ниже по диагонали черного пикселя на правой стене; ";

alias .spawn4   ".pos4; variants-msb; alias .mid mid4; alias .stairs stairs4; alias .bmain bmain4; ";

//----------------------+-----------------------------------------------------------------------------------------------------+
//                      |
//                      |
//----------------------+-----------------------+
//              SPAWN 5                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos5     "setpos -360 2120 79.896599; ";

alias mid5      ".pos5; setang -49.613087 -84.455551 0; say найти на крыше листья (самый правый лепесток) Jump Throw; ";
alias stairs5   ".pos5; setang -51.028172 -60.209785 0; say выровнять прицел по черному пикселю. Отойти назад пока прицел не коснется крыши W + Jumpt Throw; ";
alias bmain5    ".pos5; setang -53.826084 -124.449051 0; say выровнять худ по центру выпирающей балки (без растений) Jump Throw;; ";

alias .spawn5   ".pos5; variants-msb; alias .mid mid5; alias .stairs stairs5; alias .bmain bmain5; ";

//----------------------+-----------------------------------------------------------------------------------------------------+
//                      |
//                      |
//----------------------+-----------------------+
//              SPAWN 6                         |
//----------------------------------------------+-----------------------------------------------------------------------------+

alias .pos6     "setpos -292 2328 87.871254; ";

alias mid6      ".pos6; setang -43.810734 -85.324532 0; say прицел на правый угол камня над темплом Jump Throw; ";
alias stairs6   ".pos6; setang -59.172497 -66.008110 0; say идти вперед пока крыша темпла на сравняется с крышей мида W + Jump Throw; ";
alias bmain6    ".pos6; setang -35.270130 -120.428528 0; say прицел по второму слева узору на крыше темпла Jumpt Throw; ";

alias .spawn6   ".pos6; variants-msb; alias .mid mid6; alias .stairs stairs6; alias .bmain bmain6; ";

