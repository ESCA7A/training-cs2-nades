<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>CS2 Training Nades</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Docsify 5 core -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
  >

  <style>
    /* =========================================================
       CS2 / FACEIT
       ========================================================= */

    :root {
      --accent: #ff5500;
      --accent-hover: #ff6a1a;

      --bg: #0b0d0f;
      --bg-secondary: #101315;
      --bg-tertiary: #15191c;

      --border: #24292d;
      --border-light: #30363b;

      --text: #d4d8db;
      --text-muted: #858c92;
      --text-bright: #f5f6f7;

      --sidebar-width: 270px;
      --content-max-width: 980px;

      --font-size: 15px;
      --line-height: 1.7;
    }


    /* =========================================================
       IMPORTANT: SCROLL / LAYOUT
       ========================================================= */

    html {
      background: var(--bg);

      /*
       * Do not use smooth scrolling here.
       *
       * Docsify changes the URL and scroll position itself.
       * Browser smooth scrolling can make route changes feel
       * like the page is being thrown around.
       */
      scroll-behavior: auto;

      /*
       * Prevent horizontal artifacts.
       */
      overflow-x: hidden;
    }

    body {
      margin: 0;

      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      overflow-x: hidden;
    }

    /*
     * Let the browser use normal document scrolling.
     *
     * Do NOT put overflow: auto / scroll on .main.
     * This prevents nested scrolling and "jumping" behavior.
     */

    .main {
      min-height: 100vh;

      background: var(--bg);

      overflow: visible;
    }

    .content {
      position: relative;

      overflow: visible;
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      background: var(--bg-secondary);

      border-right: 1px solid var(--border);

      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-width: thin;
      scrollbar-color: #30363b transparent;
    }

    .sidebar-nav {
      padding: 0 14px 30px;
    }


    /* Brand */

    .app-name {
      padding: 0;
      margin: 0;
    }

    .app-name-link {
      display: flex !important;
      align-items: center;

      height: 72px;

      padding: 0 22px;

      color: var(--text-bright) !important;

      font-size: 16px;
      font-weight: 800;

      letter-spacing: -0.3px;

      border-bottom: 1px solid var(--border);

      text-decoration: none !important;
    }

    .app-name-link::before {
      content: "CS2";

      display: flex;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 28px;

      margin-right: 11px;

      flex-shrink: 0;

      background: var(--accent);

      border-radius: 4px;

      color: #fff;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: .5px;
    }


    /* Sidebar navigation */

    .sidebar-nav > ul {
      margin-top: 22px;
    }

    .sidebar-nav > ul > li > p {
      margin: 22px 10px 8px;

      color: #686f75;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .sidebar-nav li {
      margin: 2px 0;
    }

    .sidebar-nav a {
      display: block;

      padding: 9px 12px;

      color: var(--text-muted);

      border-radius: 5px;

      font-size: 14px;
      font-weight: 500;

      transition:
        color .15s ease,
        background .15s ease;
    }

    .sidebar-nav a:hover {
      color: #fff;

      background: rgba(255,255,255,.035);
    }

    .sidebar-nav li.active > a {
      color: #fff;

      background: rgba(255,85,0,.1);

      box-shadow:
        inset 3px 0 0 var(--accent);
    }


    /* =========================================================
       GITHUB BUTTON
       ========================================================= */

    .github-corner {
      display: none !important;
    }

    .github-link {
      display: flex;

      align-items: center;
      gap: 9px;

      margin: 24px 10px 0;
      padding: 10px 12px;

      color: #aeb4b8;

      border: 1px solid var(--border);
      border-radius: 5px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition:
        border-color .15s ease,
        color .15s ease,
        background .15s ease;
    }

    .github-link:hover {
      color: #fff;

      border-color: #3a4146;

      background: rgba(255,255,255,.03);
    }

    .github-icon {
      width: 17px;
      height: 17px;

      fill: currentColor;
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    .markdown-section {
      width: 100%;
      max-width: var(--content-max-width);

      padding-top: 48px;
      padding-bottom: 80px;

      color: var(--text);

      font-size: var(--font-size);
      line-height: var(--line-height);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--text-bright);

      font-weight: 750;

      letter-spacing: -.4px;
    }

    .markdown-section h1 {
      margin-bottom: 28px;

      font-size: 34px;
      line-height: 1.2;
    }

    .markdown-section h2 {
      margin-top: 48px;
      padding-bottom: 10px;

      border-bottom: 1px solid var(--border);

      font-size: 23px;
    }

    .markdown-section h3 {
      margin-top: 32px;

      font-size: 18px;
    }

    .markdown-section a {
      color: var(--accent);

      text-decoration: none;
    }

    .markdown-section a:hover {
      color: var(--accent-hover);

      text-decoration: underline;
    }

    .markdown-section strong {
      color: #f0f1f2;
    }


    /* =========================================================
       IMAGES
       ========================================================= */

    /*
     * Critical:
     *
     * Images must not change the page height after they load.
     * max-width alone is not enough.
     */

    .markdown-section img {
      display: block;

      max-width: 100%;
      height: auto;

      border-radius: 6px;
    }

    /*
     * QR code has a known size.
     */

    .markdown-section img[src*="qr-transfer"] {
      width: 220px;
      height: 220px;

      max-width: 220px;

      margin: 20px auto;
      padding: 10px;

      background: #fff;

      border: 1px solid var(--border-light);
      border-radius: 8px;

      object-fit: contain;
    }


    /* =========================================================
       CODE
       ========================================================= */

    .markdown-section code {
      padding: 3px 6px;

      color: #ff9b6b;

      background: #15191c;

      border: 1px solid var(--border);

      border-radius: 4px;

      font-size: .9em;
    }

    .markdown-section pre {
      margin: 24px 0;

      background: #0f1214;

      border: 1px solid var(--border);

      border-radius: 7px;

      box-shadow: 0 8px 30px rgba(0,0,0,.18);

      overflow-x: auto;
    }

    .markdown-section pre > code {
      padding: 20px;

      color: #d5d9dc;

      background: transparent;

      border: 0;

      font-size: 13px;

      line-height: 1.65;
    }


    /* =========================================================
       BLOCKQUOTES
       ========================================================= */

    .markdown-section blockquote {
      margin: 24px 0;

      padding: 12px 18px;

      color: #bfc4c8;

      background: rgba(255,85,0,.045);

      border-left: 3px solid var(--accent);

      border-radius: 0 5px 5px 0;
    }


    /* =========================================================
       TABLES
       ========================================================= */

    .markdown-section table {
      display: table;

      width: 100%;

      margin: 24px 0;

      border-collapse: separate;
      border-spacing: 0;

      border: 1px solid var(--border);

      border-radius: 6px;

      overflow: hidden;
    }

    .markdown-section th {
      color: #e9ebed;

      background: var(--bg-tertiary);

      font-weight: 700;
    }

    .markdown-section td,
    .markdown-section th {
      padding: 11px 14px;

      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .markdown-section tr:last-child td {
      border-bottom: 0;
    }

    .markdown-section td:last-child,
    .markdown-section th:last-child {
      border-right: 0;
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      margin: 0 10px;

      padding-bottom: 8px;

      border-bottom: 1px solid var(--border);
    }

    .search .search input {
      width: 100%;

      color: var(--text);

      background: #0c0f11;

      border: 1px solid var(--border);
      border-radius: 5px;

      outline: none;
    }

    .search .search input:focus {
      border-color: rgba(255,85,0,.55);
    }

    .search .search input::placeholder {
      color: #626a70;
    }

    .search .search-keyword {
      color: var(--accent);
    }


    /* =========================================================
       PAGINATION
       ========================================================= */

    .docsify-pagination-container {
      margin-top: 60px;

      border-top: 1px solid var(--border);
    }

    .pagination-item {
      color: var(--text-muted);
    }

    .pagination-item-title {
      color: var(--text-bright);
    }


    /* =========================================================
       SCROLLBAR
       ========================================================= */

    html,
    body,
    .sidebar {
      scrollbar-width: thin;
      scrollbar-color: #2b3034 transparent;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #2b3034;

      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3b4247;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 768px) {

      .markdown-section {
        padding: 30px 20px 60px;
      }

      .markdown-section h1 {
        font-size: 28px;
      }

      .markdown-section h2 {
        font-size: 21px;
      }

      .app-name-link {
        height: 60px;
      }

      .sidebar {
        box-shadow: 10px 0 30px rgba(0,0,0,.25);
      }
    }
  </style>
</head>

<body>

  <div id="app">
    Loading documentation...
  </div>

  <script>
    window.$docsify = {

      name: 'CS2 Training Nades',

      homepage: 'README.md',

      loadSidebar: true,

      subMaxLevel: 3,

      /*
       * Keep automatic top scrolling only for route changes.
       */
      auto2top: true,

      relativePath: true,

      routerMode: 'hash',

      search: {
        placeholder: 'Search documentation...',
        noData: 'Nothing found.',
        depth: 6
      },

      themeColor: '#ff5500'
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

  <script>
    /*
     * GitHub button
     */

        document.querySelector('.sidebar-nav');

      if (!sidebar) {
        return;
      }

      const github =
        document.createElement('a');

      github.className = 'github-link';

        </svg>

        <span>View on GitHub</span>
      `;

      sidebar.appendChild(github);
    });
  </script>

</body>
</html>
