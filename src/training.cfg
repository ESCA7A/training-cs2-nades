//----------------+
//    PREPARE     |
//----------------+---------------------------+
                                            //|
sv_cheats 1;                                //| -> включение читов
//bind "v" "noclip"; 	                        //| -> режим полета на V. Что бы воспользоваться нужно убрать первые два слеша и поставить свою кнопку вместо "v"
vprof_off;                                  //| -> Отключение VProf профилировщика
iv_off;                                     //| -> Выключение записи переменных интерполяции
cl_disable_ragdolls 1;                      //| -> Выключение редгол физики
                                            //|
//-------+------------------------------------+
//       |
//----------------+
//    GRENADES    |
//----------------+-------------------------------------------------------+
                                                                        //|
//bind "t" "sv_rethrow_last_grenade";                                     //| -> посмотреть последнюю гранату. Что бы воспользоваться нужно убрать первые два слеша и поставить свою кнопку вместо "t"
sv_grenade_trajectory_prac_pipreview 1;	                                //| -> просмотр траектории
sv_grenade_trajectory_prac_trailtime 4;                                 //| -> время следа траектории
ammo_grenade_limit_total 5;                                             //| -> лимит гранат
                                                                        //|
//-------+----------------------------------------------------------------+
//       |
//-------+--------------------+
//    START ROUND SETTINGS    |
//----------------------------+-----------+
				                        //|
bot_kick;			                    //| -> удаление ботов
sv_infinite_ammo 1;			            //| -> бесконечные патроны
sv_showimpacts 1;		                //| -> показать импакт от выстрела
mp_warmup_end;			                //| -> убрать вармап
mp_freezetime 0;		                //| -> замарозки перед началом раунда нет
mp_roundtime inf;		                //| -> время раунда бесконечно
mp_roundtime_defuse 120;	            //|
mp_limitteams 0;		                //| -> отключение баланса команд
mp_autoteambalance 0;		            //| -> отключение авто-баланса команд
mp_maxmoney inf;		                //| -> максимальные деньги
mp_startmoney 999999;	                //| -> бесконечные деньги
mp_buytime inf;		                    //| -> время покупки бесконечно
mp_buy_anywhere 1;		                //| -> зона покупки везде
bot_add_ct;                             //| -> добавить бота за КТ
bot_add_t;                              //| -> добаить бота за Т
bot_stop 1;                             //| -> боты не двигаются
mp_respawn_on_death_ct 1;               //| -> контр-террористы респавнятся после смерти
mp_respawn_on_death_t 1;                //| -> террористы респавнятся после смерти
mp_ignore_round_win_conditions 1;       //| -> игнорироание конца раунда
mp_restartgame 1;		                //| -> старт
				                        //|
//-------+--------------------------------+
//       |
//-------+--------------+
//	SERVER COMMANDS     |
//----------------------+-----------------------------+
                                                    //|
exec .aliases/training/commandList.cfg;             //| -> Список доступных команд
exec .aliases/training/commands/skipTime.cfg;       //| -> Перемотка времени
exec .aliases/training/commands/heal.cfg;           //| -> восстановить хп
exec .aliases/training/commands/clear_map.cfg;      //| -> очистить карту от гранат
exec .aliases/training/knifeList.cfg;               //| -> посмотреть список ножей
exec .aliases/training/commands/maps.cfg;           //| -> выбрать карту для раскида
                                                    //|
//-------+--------------------------------------------+
//       |
//-------+--------------+
//	KNIFES		        |
//----------------------+---------------------+
                                            //|
exec .aliases/training/commands/knifes.cfg; //|
                                            //|
